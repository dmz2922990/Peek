[package]
name = "peek"
version = "0.3.7"
edition = "2024"
repository = "https://github.com/dmz2922990/Peek"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tui-textarea = "0.7"
arboard = "3"
anyhow = "1"
notify = "6"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
unicode-width = "0.2.0"

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "npm"]
publish-jobs = ["npm"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
install-updater = false
allow-dirty = ["ci"]
