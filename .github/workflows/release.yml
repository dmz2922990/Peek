name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v[0-9]+.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dist
        run: cargo install cargo-dist --version 0.31.0 --locked
      - name: Build artifacts
        run: dist build --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: target/distrib/
          merge-multiple: true
      - name: List artifacts
        run: find target/distrib -type f | head -50
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "target/distrib/**/*"
          artifactErrorsFailBuild: true

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Find npm package
        id: find_npm
        run: |
          PKG_DIR=$(find artifacts -name "package.json" -type f -printf '%h\n' | head -1)
          if [ -z "$PKG_DIR" ]; then
            echo "No npm package found, skipping"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
            cat "$PKG_DIR/package.json"
          fi
      - uses: actions/setup-node@v4
        if: steps.find_npm.outputs.found == 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        if: steps.find_npm.outputs.found == 'true'
        working-directory: ${{ steps.find_npm.outputs.dir }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
